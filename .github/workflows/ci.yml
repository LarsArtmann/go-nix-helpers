name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix Store
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Check Flake
        run: nix flake check --no-build

      - name: Format Check
        run: nix fmt -- --ci

  integration-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix Store
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Run Integration Tests
        run: nix build .#checks.${{ runner.arch == 'X64' && 'x86_64-linux' || 'aarch64-darwin' }}.verify

      - name: Run Module Tests
        run: nix build .#checks.${{ runner.arch == 'X64' && 'x86_64-linux' || 'aarch64-darwin' }}.moduleTest

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix Store
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Generate flake from go-standard template
        run: |
          ./scripts/generate-flake.sh --dir /tmp/smoke-test smoke-test
          test -f /tmp/smoke-test/flake.nix
          nix-instantiate --parse /tmp/smoke-test/flake.nix > /dev/null
          echo "PASS: go-standard template generates valid Nix"

      - name: Generate flake with --templ
        run: |
          ./scripts/generate-flake.sh --dir /tmp/smoke-templ --templ smoke-templ
          nix-instantiate --parse /tmp/smoke-templ/flake.nix > /dev/null
          echo "PASS: --templ flag produces valid Nix"

      - name: Generate flake with --go-mod
        run: |
          ./scripts/generate-flake.sh --dir /tmp/smoke-gomod --go-mod smoke-gomod
          test -f /tmp/smoke-gomod/flake.nix
          test -f /tmp/smoke-gomod/go.mod
          test -f /tmp/smoke-gomod/main.go
          nix-instantiate --parse /tmp/smoke-gomod/flake.nix > /dev/null
          echo "PASS: --go-mod flag creates flake.nix + go.mod + main.go"

      - name: Generate flake with --private-deps
        run: |
          ./scripts/generate-flake.sh --dir /tmp/smoke-deps --private-deps smoke-deps
          test -f /tmp/smoke-deps/flake.nix
          grep -q "deps = {" /tmp/smoke-deps/flake.nix
          nix-instantiate --parse /tmp/smoke-deps/flake.nix > /dev/null
          echo "PASS: --private-deps flag creates deps section"

      - name: Generate flake with combined flags
        run: |
          ./scripts/generate-flake.sh --dir /tmp/smoke-combined --go-mod --private-deps --templ smoke-combined
          test -f /tmp/smoke-combined/go.mod
          test -f /tmp/smoke-combined/main.go
          grep -q "deps = {" /tmp/smoke-combined/flake.nix
          grep -q "enableTempl = true" /tmp/smoke-combined/flake.nix
          nix-instantiate --parse /tmp/smoke-combined/flake.nix > /dev/null
          echo "PASS: --go-mod --private-deps --templ combined flags work"

      - name: Generate flake from go-flake-parts template
        run: |
          ./scripts/generate-flake.sh --dir /tmp/smoke-parts --template go-flake-parts smoke-parts
          nix-instantiate --parse /tmp/smoke-parts/flake.nix > /dev/null
          echo "PASS: go-flake-parts template generates valid Nix"

  flake-lock-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Cache Nix Store
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Check flake.lock freshness
        run: |
          cp flake.lock /tmp/flake-lock-backup
          nix flake update
          if ! diff -q flake.lock /tmp/flake-lock-backup > /dev/null; then
            echo "ERROR: flake.lock is stale. Run 'nix flake update' to update."
            diff flake.lock /tmp/flake-lock-backup || true
            exit 1
          fi
          echo "PASS: flake.lock is up to date"

  private-deps-test:
    runs-on: ubuntu-latest
    if: false # Enable when SSH key secret is configured
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Configure SSH for private repos
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Build with private deps
        run: |
          # Test that a consumer flake with private deps builds correctly
          # Requires a test consumer repo with deps on LarsArtmann private repos
          nix build .#checks.x86_64-linux.verify
