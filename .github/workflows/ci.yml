name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual full-build oracle: run when the local host is broken and CI must
  # be the verifier (AGENTS.md host-break canon), or to measure job timings.
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: the clean-worktree evaluation below needs revCount,
        # which shallow clones cannot provide.
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Cache Nix Store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: Check Flake
        # --no-build: evaluate all outputs without building (faster CI).
        # --all-systems is NOT used because Linux cannot evaluate darwin
        # derivations. Cross-platform coverage is achieved via the
        # ubuntu-latest + macos-latest matrix below.
        #
        # Evaluate from a clean worktree (AGENTS.md "daemon + GC race"
        # recipe): the moduleTest self-hosting check imports
        # mkPreparedSource.nix by interpolating the flake source path, and
        # evaluating against the actions/checkout working tree made that
        # path intermittently "not valid" on fresh runners. A worktree of
        # HEAD gives nix a stable git state to fetch from.
        run: |
          git worktree add /tmp/clean-check HEAD
          cd /tmp/clean-check && nix flake check --no-build

      - name: Format Check
        run: nix fmt -- --ci

  integration-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history: the clean-worktree build below needs revCount,
        # which shallow clones cannot provide.
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Cache Nix Store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: Run Integration and Module Tests
        # Build from a clean worktree of HEAD (see Check Flake note): the
        # moduleTest build intermittently failed with "Cannot build" when
        # nix re-fetched the flake source from the actions/checkout tree.
        run: |
          git worktree add /tmp/clean-integration HEAD
          cd /tmp/clean-integration
          SYSTEM=$(nix eval --raw --impure --expr 'builtins.currentSystem')
          nix build .#checks.$SYSTEM.verify
          nix build .#checks.$SYSTEM.moduleTest
          nix build .#checks.$SYSTEM.pureFunctions
          nix build .#checks.$SYSTEM.structural

      - name: Container smoke test (real nix2container backend)
        # containerSmoke exercises the REAL n2c Go binary (image.json
        # assembly + jq gates) — the module tests stub the backend. Linux
        # only: one real-backend leg is enough, and nix2container image
        # builds are pointless on macOS runners.
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd /tmp/clean-integration
          nix build .#checks.x86_64-linux.containerSmoke

  old-nixpkgs-module-test:
    # Auto-default degradation: against an older nixpkgs (2026-06-22 rev —
    # go_1_26 era, no go_1_27), the moduleTest must stay green: the
    # goPkgAttr auto-default resolves the newest available branch, and a
    # stale pin below the consumer's go.mod floor throws via the floor
    # check (asserted as the correct outcome). Catches hardcoded-version
    # regressions that only today's nixpkgs would hide.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Cache Nix Store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: Module test against the pinned old nixpkgs
        # PIN REFRESH POLICY: the pinned rev (2026-06-22, go_1_26 era) exists
        # to prove the goPkgAttr auto-default DEGRADES correctly on nixpkgs
        # that lack the newest go_1_XX branch. Refresh it only when today's
        # nixpkgs drops a Go branch the pin still has — move it forward to a
        # rev one Go-branch behind current, and re-record the expectation
        # above. Bumping it in lockstep with nixpkgs would make this job
        # test nothing.
        run: |
          SYSTEM=$(nix eval --raw --impure --expr 'builtins.currentSystem')
          nix build \
            --override-input nixpkgs github:NixOS/nixpkgs/567a49d1913ce81ac6e9582e3553dd90a955875f \
            .#checks.$SYSTEM.moduleTest

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Cache Nix Store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: Generate flake from go-standard template
        run: |
          ./scripts/generate-flake.sh --dir /tmp/smoke-test smoke-test
          test -f /tmp/smoke-test/flake.nix
          nix-instantiate --parse /tmp/smoke-test/flake.nix > /dev/null
          echo "PASS: go-standard template generates valid Nix"

      - name: Generate flake with --templ
        run: |
          ./scripts/generate-flake.sh --dir /tmp/smoke-templ --templ smoke-templ
          nix-instantiate --parse /tmp/smoke-templ/flake.nix > /dev/null
          echo "PASS: --templ flag produces valid Nix"

      - name: Generate flake with --go-mod
        run: |
          ./scripts/generate-flake.sh --dir /tmp/smoke-gomod --go-mod smoke-gomod
          test -f /tmp/smoke-gomod/flake.nix
          test -f /tmp/smoke-gomod/go.mod
          test -f /tmp/smoke-gomod/main.go
          nix-instantiate --parse /tmp/smoke-gomod/flake.nix > /dev/null
          echo "PASS: --go-mod flag creates flake.nix + go.mod + main.go"

      - name: Generate flake with --private-deps
        run: |
          ./scripts/generate-flake.sh --dir /tmp/smoke-deps --private-deps smoke-deps
          test -f /tmp/smoke-deps/flake.nix
          grep -q "deps = {" /tmp/smoke-deps/flake.nix
          nix-instantiate --parse /tmp/smoke-deps/flake.nix > /dev/null
          echo "PASS: --private-deps flag creates deps section"

      - name: Generate flake with combined flags
        run: |
          ./scripts/generate-flake.sh --dir /tmp/smoke-combined --go-mod --private-deps --templ smoke-combined
          test -f /tmp/smoke-combined/go.mod
          test -f /tmp/smoke-combined/main.go
          grep -q "deps = {" /tmp/smoke-combined/flake.nix
          grep -q "enableTempl = true" /tmp/smoke-combined/flake.nix
          nix-instantiate --parse /tmp/smoke-combined/flake.nix > /dev/null
          echo "PASS: --go-mod --private-deps --templ combined flags work"

      - name: Generate flake with --dry-run
        run: |
          ./scripts/generate-flake.sh --dir /tmp/smoke-dryrun --dry-run smoke-dryrun 2>&1 | tee /tmp/dryrun-output
          test ! -d /tmp/smoke-dryrun
          grep -q "flake.nix" /tmp/dryrun-output
          echo "PASS: --dry-run previews without writing"

      - name: Generate flake with --verbose
        run: |
          ./scripts/generate-flake.sh --dir /tmp/smoke-verbose --verbose smoke-verbose 2>&1 | tee /tmp/verbose-output
          test -f /tmp/smoke-verbose/flake.nix
          grep -q "Created" /tmp/verbose-output
          echo "PASS: --verbose lists created files"

      - name: Generate flake from go-flake-parts template
        run: |
          ./scripts/generate-flake.sh --dir /tmp/smoke-parts --template go-flake-parts smoke-parts
          nix-instantiate --parse /tmp/smoke-parts/flake.nix > /dev/null
          echo "PASS: go-flake-parts template generates valid Nix"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Cache Nix Store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: Run shellcheck on all scripts
        run: nix run nixpkgs#shellcheck -- scripts/*.sh

  full-flake-check:
    # workflow_dispatch ONLY: the full-build oracle (containerSmoke included)
    # for when the local host is broken or a timing baseline is needed. Too
    # heavy for the per-push path.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Cache Nix Store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: Full flake check (eval all systems, build native)
        run: |
          git worktree add /tmp/clean-full HEAD
          cd /tmp/clean-full
          nix flake check --all-systems --no-build
          nix flake check

  flake-lock-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Cache Nix Store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      - name: Check flake.lock freshness
        run: |
          cp flake.lock /tmp/flake-lock-backup
          nix flake update
          if ! diff -q flake.lock /tmp/flake-lock-backup > /dev/null; then
            echo "ERROR: flake.lock is stale. Run 'nix flake update' to update."
            diff flake.lock /tmp/flake-lock-backup || true
            exit 1
          fi
          echo "PASS: flake.lock is up to date"

  private-deps-test:
    runs-on: ubuntu-latest
    # Disabled until DEPLOY_SSH_KEY secret is added to GitHub repo settings.
    # This would test a real consumer flake with private LarsArtmann deps,
    # catching breakages that mock tests cannot detect.
    if: false # Enable when SSH key secret is configured
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Configure SSH for private repos
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Build with private deps
        run: |
          # Test that a consumer flake with private deps builds correctly
          # Requires a test consumer repo with deps on LarsArtmann private repos
          nix build .#checks.x86_64-linux.verify
